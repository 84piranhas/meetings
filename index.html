<!DOCTYPE html>
<!-- THÈME : data-skin="inst" (institutionnel) ou data-skin="sky" (ciel, design précédent). Changer ce seul attribut suffit. -->
<html lang="en" data-skin="inst">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meetings à la carte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: outil d'équipe sobre et direct, comme un bon tableau de bord interne
   IDEA: un présentoir de cartes-rituels qu'on tire, qu'on demande, puis qu'on épingle au calendrier
   PICTURE: la grille de cartes elle-même ; le calendrier mensuel en second onglet
   COLOUR and TYPE: bande ciel #4fb3e8, encre #10223a, orange #ff7a1a pour l'action ; une couleur par catégorie ; Outfit + Inter
   LAYOUT: bande pôle/produit + langue + rôle, onglets, contenu jusqu'à 1240px, une colonne sous 600px */
:root{color-scheme:light dark;--bg:light-dark(#f6f9fc,#0b1726);--ink:light-dark(#10223a,#e6eef7);--band:light-dark(#4fb3e8,#12324f);--bandink:light-dark(#10223a,#e6eef7);--mut:light-dark(#4a5e75,#9db0c4);--line:light-dark(#d7e2ec,#21405f);--card:light-dark(#ffffff,#10223a);--soft:light-dark(#e8f4fc,#15304d);--acc:#ff7a1a;--accink:#1d0e00;--ok:light-dark(#17784f,#5fd39c);--ko:light-dark(#b23a0a,#ff9a66);--pend:light-dark(#8a5a00,#ffc46b);
--f0:light-dark(#1f6fd1,#6aa8f0);--f1:light-dark(#b8357a,#f08cc0);--f2:light-dark(#0e8a7a,#4fd1bd);--f3:light-dark(#a36f00,#f2bd4b);--f4:light-dark(#c0362c,#ff8a7f);--f5:light-dark(#6a48c9,#a993f2);--f6:light-dark(#5d6b7c,#a9b6c4)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header{background:var(--band);color:var(--bandink);padding:22px 0 0}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between}
.top h1{font-size:clamp(28px,4vw,40px)}
.top p{margin:4px 0 0;font-size:15px;opacity:.85;max-width:60ch}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.ctl label{font-size:13px;font-weight:600}
.ctl .grp{display:flex;align-items:center;gap:8px}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%}
.ctl select{width:auto;min-width:140px;max-width:240px}
.seg{display:inline-flex;background:color-mix(in srgb,var(--card) 70%,transparent);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 12px;min-height:40px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sp{flex:1}
.tabs{display:flex;gap:4px;margin-top:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 16px;min-height:44px;font-weight:600;border-radius:12px 12px 0 0;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
.badge[hidden]{display:none}.badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--acc);color:var(--accink);font-size:12px;line-height:22px;text-align:center}
main{padding:24px 0 48px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar input{flex:1 1 220px;width:auto}
.flt[hidden]{display:none}.flt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.flt>b{font-size:13px;color:var(--mut);margin-right:4px;font-weight:600}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;min-height:36px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[data-fam]:not([data-fam=""])[aria-pressed=true]{background:color-mix(in srgb,var(--fc) 20%,var(--card));color:var(--ink);border-color:var(--fc)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;min-height:44px;font-weight:600;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}a.btn.pri{color:var(--accink)}
header .btn{background:color-mix(in srgb,var(--card) 70%,transparent);border-color:transparent;min-height:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px;margin-top:8px}
.mc{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--fc,var(--line));border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.mc .fam{font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fl{display:inline-flex;align-items:center;gap:8px;color:var(--fc);font-weight:600}
.ico{flex:none;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--fc) 16%,transparent);color:var(--fc);display:inline-grid;place-items:center}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{width:10px;height:10px;border-radius:50%;background:var(--fc);display:inline-block;margin-right:6px}
.mc h3{font-size:21px}
.mc p{margin:0;font-size:15px}
.req{font-size:13px;font-weight:600;color:var(--ko);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mut);white-space:nowrap}
.tag.scope{border-color:var(--ink);color:var(--ink);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;margin:0}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.stat{font-size:13px;color:var(--mut);background:var(--soft);border-radius:10px;padding:8px 10px}
.stat b{color:var(--ink);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center}
.empty p{color:var(--mut);margin:6px 0 16px}
.views{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:14px}
.views button{border:0;background:none;border-radius:9px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px}
.views button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.mc.cat{background:color-mix(in srgb,var(--card) 55%,var(--bg));border-style:dashed;border-top-style:solid}
.flag{font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;white-space:nowrap}
.mc.indeck{opacity:.72}.mc.indeck .btn:disabled{opacity:1;cursor:default}.flag.in{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.flag.new{background:var(--acc);color:var(--accink)}.flag.dorm{background:color-mix(in srgb,var(--pend) 18%,transparent);color:var(--pend)}
.trace{font-size:13px;color:var(--mut);margin:0}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.md{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.md h3{font-size:22px}.md p{margin:0;font-size:15px}
.md .kv{font-size:14px}.md .kv dd{font-weight:600}
.md .lbl{font-size:12px;font-weight:600;color:var(--mut);text-transform:none;margin-bottom:2px}
.mlist{display:flex;flex-wrap:wrap;gap:6px}
.mlist button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 9px;font-size:13px;min-height:32px}
.md a{color:inherit;font-size:13px}
.mlist button.arch{opacity:.55;text-decoration:line-through}
.mlist button.miss{border-style:dashed;background:none;color:var(--mut)}
.mlist button.oth{font-style:italic;background:none}
.mlist button:disabled{cursor:not-allowed;opacity:.45}
.legend2{font-size:13px;color:var(--mut);margin:-8px 0 18px}
.intro{max-width:80ch;margin:0 0 18px;font-size:16px}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:12px 16px;margin:6px 0 4px;font-size:14px}
section+section{margin-top:28px}
section>h2{font-size:22px;margin-bottom:12px}
.rows{display:grid;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--fc,var(--line));border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.row h3{font-size:18px}
.row .meta{font-size:14px;color:var(--mut)}
.row .why{font-size:15px;margin:4px 0 0}
.st{font-size:13px;font-weight:600;white-space:nowrap}
.st.pending{color:var(--pend)}.st.approved{color:var(--ok)}.st.rejected,.st.cancelled{color:var(--ko)}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.calhead h2{font-size:24px;flex:1;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--soft);font-size:13px;font-weight:600;padding:6px 8px;color:var(--mut)}
.cal .day{background:var(--card);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px}
.cal .day.out{background:var(--bg);opacity:.6}
.cal .day.today .n{background:var(--acc);color:var(--accink);border-radius:10px;padding:0 7px}
.cal .n{font-size:13px;font-weight:600;align-self:flex-start}
.ev{border:0;text-align:left;background:color-mix(in srgb,var(--fc,var(--band)) 15%,var(--card));border-left:3px solid var(--fc,var(--band));border-radius:6px;padding:3px 6px;font-size:12px;line-height:1.3;width:100%}
.ev time{font-weight:600;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--fc);font-weight:600}
.legend .ico{width:24px;height:24px;border-radius:7px}.legend .ico svg{width:15px;height:15px}
.agenda{margin-top:22px}
.ov{position:fixed;inset:0;background:rgb(5 15 30/.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov[hidden]{display:none}
.dlg{background:var(--card);color:var(--ink);border-radius:18px;width:min(600px,100%);max-height:90vh;overflow:auto;padding:22px}
.dlg:focus{outline:none}.dlg h2{font-size:24px;margin-bottom:6px}
.dlg .sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:14px;font-weight:600}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f .chk{display:flex;gap:10px;align-items:center;font-weight:500}
.f .chk input{width:22px;min-height:22px;flex:none}
.f fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0}
.f legend{font-size:14px;font-weight:600;padding:0 4px}
.f .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 12px}
.f details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.f summary{font-weight:600;font-size:14px;cursor:pointer;min-height:28px}
.f details[open] summary{margin-bottom:10px}
.f details>.f{gap:10px}
.hint{font-size:13px;color:var(--mut);font-weight:400;margin:0}
textarea{min-height:76px;resize:vertical}
.dacts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}
.dacts .left{margin-right:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
.toast[hidden]{display:none}
.note{font-size:13px;color:var(--mut);margin-top:28px}
.warn{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px}
@media(max-width:600px){
 .ctl .grp{width:100%}.ctl select{flex:1;max-width:none}
 .cal .day{min-height:58px;padding:4px}
 .cal .dow{padding:4px;font-size:12px;text-align:center}
 .ev{font-size:0;padding:0;height:8px;border-left-width:0;background:var(--fc,var(--band))}
 .f .two{grid-template-columns:1fr}
 .flt{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.flt .chip,.flt>b{flex:none;white-space:nowrap}
 .row{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:no-preference){.mc{transition:transform .15s}.mc:hover{transform:translateY(-2px)}}
/* ===== Thème institutionnel (data-skin="inst") : graphite, une seule couleur d'accent, typographie serrée, densité ===== */
:root[data-skin=inst]{--bg:light-dark(#f3f4f6,#0a0d12);--ink:light-dark(#0e1116,#e7eaee);--band:#12171e;--bandink:#e7eaee;--mut:light-dark(#5b6472,#94a0ae);--line:light-dark(#d8dce2,#232b36);--card:light-dark(#ffffff,#11161e);--soft:light-dark(#eef0f3,#171d27);--acc:light-dark(#1f5bff,#6b96ff);--accink:light-dark(#ffffff,#05070a);
 --f0:light-dark(#3b6fb6,#86abdd);--f1:light-dark(#985078,#d6a0bd);--f2:light-dark(#2f7d72,#80c4b9);--f3:light-dark(#86681f,#d3b46e);--f4:light-dark(#a3473f,#e29d96);--f5:light-dark(#62509f,#ab9de0);--f6:light-dark(#5f6b7a,#a6b0bc)}
[data-skin=inst] body{font:15px/1.5 'IBM Plex Sans',Inter,system-ui,sans-serif}
[data-skin=inst] h1,[data-skin=inst] h2,[data-skin=inst] h3{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;font-weight:600;letter-spacing:0}
[data-skin=inst] header{padding:14px 0 0;border-bottom:1px solid #000}
[data-skin=inst] .top h1{font-size:clamp(22px,2.6vw,28px)}
[data-skin=inst] .top p{font-size:14px;opacity:.7}
[data-skin=inst] .ctl{margin-top:12px}
[data-skin=inst] .ctl label{font-weight:500;color:#aab3bf}
[data-skin=inst] header select{background:#1a2029;color:#e7eaee;border-color:#2b3440;border-radius:3px;min-height:38px;padding:7px 10px}
[data-skin=inst] header .btn{background:transparent;border:1px solid #2b3440;color:#e7eaee;border-radius:3px;min-height:38px}
[data-skin=inst] .seg{background:#1a2029;border-radius:3px;padding:2px}
[data-skin=inst] .seg button{border-radius:2px;min-height:34px;color:#c3cad3}
[data-skin=inst] .seg button[aria-pressed=true]{background:var(--acc);color:var(--accink)}
[data-skin=inst] .tabs{margin-top:12px;gap:0}
[data-skin=inst] .tabs button{border-radius:0;color:#aab3bf;border-bottom:2px solid transparent;padding:10px 16px}
[data-skin=inst] .tabs button[aria-selected=true]{background:none;color:#fff;border-bottom-color:var(--acc)}
[data-skin=inst] .badge{border-radius:2px;color:#fff;background:var(--acc)}
[data-skin=inst] main{padding-top:18px}
[data-skin=inst] .views{background:none;border-bottom:1px solid var(--line);border-radius:0;padding:0;gap:0}
[data-skin=inst] .views button{border-radius:0;border-bottom:2px solid transparent;color:var(--mut);min-height:38px}
[data-skin=inst] .views button[aria-pressed=true]{background:none;color:var(--ink);border-bottom-color:var(--acc)}
[data-skin=inst] .mc,[data-skin=inst] .md,[data-skin=inst] .row,[data-skin=inst] .empty,[data-skin=inst] .dlg,[data-skin=inst] .banner,[data-skin=inst] .cal,[data-skin=inst] .warn{border-radius:4px}
[data-skin=inst] .btn,[data-skin=inst] .chip,[data-skin=inst] select,[data-skin=inst] input,[data-skin=inst] textarea,[data-skin=inst] .mlist button{border-radius:3px}
[data-skin=inst] .btn{min-height:38px;padding:7px 12px;font-weight:500}
[data-skin=inst] .chip{min-height:32px;padding:4px 10px;font-size:13px}
[data-skin=inst] .chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
[data-skin=inst] .grid{gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
[data-skin=inst] .mc{padding:14px;gap:8px;border-top-width:3px;box-shadow:none}
[data-skin=inst] .mc h3{font-size:18px}
[data-skin=inst] .mc p{font-size:14px}
[data-skin=inst] .kv{font-size:13px}
[data-skin=inst] .ico{width:24px;height:24px;border-radius:3px}[data-skin=inst] .ico svg{width:15px;height:15px}
[data-skin=inst] .stat,[data-skin=inst] .tag,[data-skin=inst] .flag{border-radius:2px}
[data-skin=inst] .stat{background:none;border-top:1px solid var(--line);border-radius:0;padding:8px 0 0}
[data-skin=inst] .cal .day{min-height:92px}
[data-skin=inst] .cal .day.today .n{border-radius:2px;color:var(--accink)}
[data-skin=inst] .ev{border-radius:2px}
[data-skin=inst] .row{padding:12px 14px}
@media(prefers-reduced-motion:no-preference){[data-skin=inst] .mc:hover{transform:none;border-color:var(--mut)}}
.login{background:var(--band);align-items:center}
.login .dlg{width:min(460px,100%)}
.login .lgl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.login .seg{background:var(--soft)}.login .seg button{color:var(--ink)}
.login .err{color:var(--ko);font-size:14px;margin:0;min-height:1em}
#coBtn{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <div class="top">
   <div><h1>Meetings à la carte</h1><p id="sub"></p></div>
   <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button></div>
  </div>
  <div class="ctl">
   <div class="grp"><label for="pole" id="lPole"></label><select id="pole"></select></div>
   <div class="grp"><label for="prod" id="lProd"></label><select id="prod"></select></div>
   <button class="btn" id="addPole" type="button"></button>
   <button class="btn" id="addProd" type="button"></button>
   <button class="btn" id="settings" type="button"></button>
   <button class="btn" id="coBtn" type="button"></button>
   <span class="sp"></span>
   <div class="seg" role="group" id="roles"><button type="button" data-role="dev"></button><button type="button" data-role="mgr"></button></div>
  </div>
  <nav class="tabs" role="tablist">
   <button role="tab" data-tab="cards"></button>
   <button role="tab" data-tab="requests"></button>
   <button role="tab" data-tab="calendar"></button>
   <button role="tab" data-tab="methods"></button>
  </nav>
 </div>
</header>
<main class="wrap">
 <div id="warn" class="warn" hidden></div>
 <div id="v-cards">
  <div class="views" id="views" role="group"></div>
  <div class="bar"><input id="q" type="search"><button class="btn pri" id="newCard" type="button"></button></div>
  <div class="flt" id="fams"></div>
  <div class="flt" id="meths"></div>
  <div id="grid"></div>
 </div>
 <div id="v-requests" hidden></div>
 <div id="v-calendar" hidden></div>
 <div id="v-methods" hidden></div>
 <p class="note" id="foot"></p>
</main>
<div class="ov login" id="login" hidden><form class="dlg f" id="loginForm" autocomplete="on">
 <div class="lgl"><h2 id="lgTitle">Meetings à la carte</h2><div class="seg" role="group"><button type="button" data-lglang="en">EN</button><button type="button" data-lglang="fr">FR</button></div></div>
 <p class="sub" id="lgSub"></p>
 <label><span id="lgCo"></span><input id="lgCompany" name="organization" autocomplete="organization" required></label>
 <label><span id="lgNm"></span><input id="lgNameIn" name="name" autocomplete="name"></label>
 <p class="err" id="lgErr"></p>
 <p class="hint" id="lgWarn"></p>
 <p class="hint" id="lgDemo" hidden></p>
 <div class="dacts"><button class="btn pri" id="lgGo"></button></div>
</form></div>
<script>

 // ---------- Mode démo : stockage local, même API ----------
 function demoDB(t){
  const KEY='mtg.demo.'+t;const L={};
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
  let D=load();const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
  const snap=c=>({docs:Object.entries(D[c]||{}).map(([id,d])=>({id,exists:true,data:()=>d})),metadata:{fromCache:false,hasPendingWrites:false}});
  const emit=c=>(L[c]||[]).forEach(f=>f(snap(c)));
  window.addEventListener('storage',e=>{if(e.key===KEY){D=load();Object.keys(L).forEach(emit)}});
  const split=p=>{const i=p.indexOf('/');return [p.slice(0,i),p.slice(i+1)]};
  const clone=o=>JSON.parse(JSON.stringify(o));
  return {
   collection:c=>({onSnapshot:(n)=>{(L[c]=L[c]||[]).push(n);setTimeout(()=>n(snap(c)));return()=>{L[c]=L[c].filter(f=>f!==n)}},
    add:async d=>{const id=Math.random().toString(36).slice(2,12);(D[c]=D[c]||{})[id]=clone(d);save();emit(c);return {id}}}),
   doc:p=>{const [c,id]=split(p);return {
    set:async d=>{(D[c]=D[c]||{})[id]=clone(d);save();emit(c)},
    update:async d=>{if(!D[c]||!D[c][id])throw {code:'invalid_argument',message:'missing'};
     for(const k in d){if(d[k]&&d[k].__delete__)delete D[c][id][k];else D[c][id][k]=clone(d[k])}save();emit(c)},
    delete:async()=>{if(D[c])delete D[c][id];save();emit(c)}}}
  };
 }

 // ---------- Firebase Firestore : tenants/<entreprise>/<collection>/<document> ----------
 async function fireDB(t){
  const base='https://www.gstatic.com/firebasejs/'+FIREBASE_SDK+'/';
  const A=await import(base+'firebase-app.js');const F=await import(base+'firebase-firestore.js');
  const app=A.initializeApp(FIREBASE_CONFIG);
  const fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true});
  const root='tenants/'+t+'/';
  const err=e=>({code:e&&e.code==='permission-denied'?'invalid_argument':((e&&e.code)||'unavailable'),message:(e&&e.message)||''});
  const wrap=s=>({docs:s.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()})),metadata:{fromCache:s.metadata.fromCache,hasPendingWrites:s.metadata.hasPendingWrites}});
  const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){throw err(e)}};
  const fix=d=>{const o={};for(const k in d)o[k]=(d[k]&&d[k].__delete__)?F.deleteField():d[k];return o};
  return {
   collection:c=>({onSnapshot:(n,e)=>F.onSnapshot(F.collection(fs,root+c),s=>n(wrap(s)),x=>e&&e(err(x))),
    add:guard(async d=>{const r=await F.addDoc(F.collection(fs,root+c),d);return {id:r.id}})}),
   doc:p=>{const r=F.doc(fs,root+p);return {set:guard(d=>F.setDoc(r,d)),update:guard(d=>F.updateDoc(r,fix(d))),delete:guard(()=>F.deleteDoc(r))}}
  };
 }

 async function start(company,name){

  try{DB=demo?demoDB(t):await fireDB(t)}catch(e){console.error(e);DB=null}
  if(DB){
   DB.collection('members').onSnapshot(s=>{members={};s.docs.forEach(d=>members[d.id]=d.data());resolveMembers()},()=>resolveMembers());
   const nm=LS.get('mtg.name');if(nm)DB.doc('members/'+uid).set({name:nm,at:new Date().toISOString()}).catch(()=>{});
  }else resolveMembers();
  window.MTG.company=company;
  const lg=document.getElementById('login');if(lg)lg.hidden=true;
  resolveReady();return true;
 }

function drawCal(){
 const v=$('#v-calendar');const m=S.month;const y=m.getFullYear(),mo=m.getMonth();
 const off=(new Date(y,mo,1).getDay()+6)%7;const g0=new Date(y,mo,1-off);
 const evs=scopeReqs().filter(r=>r.status==='approved'&&r.scheduledAt).sort((a,b)=>a.scheduledAt.localeCompare(b.scheduledAt));
 const today=ymd(new Date());let cells=tr('dows').map(d=>`<div class="dow">${d}</div>`).join('');
 for(let i=0;i<42;i++){const d=new Date(g0.getFullYear(),g0.getMonth(),g0.getDate()+i);const k=ymd(d);
  const de=evs.filter(r=>r.scheduledAt.slice(0,10)===k);
  cells+=`<div class="day${d.getMonth()!==mo?' out':''}${k===today?' today':''}"><span class="n">${d.getDate()}</span>${de.map(r=>{const c=cardById(r.cardId);const nm=c?tx(c,'name'):tr('delCard');return `<button class="ev" style="${fc(c&&c.family)}" data-act="ev" data-id="${esc(r.id)}" title="${esc(nm+' · '+scopeName(r.pole,r.product))}"><time>${fmtT(r.scheduledAt)}</time> ${esc(nm)}</button>`}).join('')}</div>`;
  if(i===34&&new Date(g0.getFullYear(),g0.getMonth(),g0.getDate()+35).getMonth()!==mo)break}
 const inM=evs.filter(r=>{const d=new Date(r.scheduledAt);return d.getMonth()===mo&&d.getFullYear()===y});
 v.innerHTML=`<div class="calhead"><button class="btn" data-act="prev" aria-label="${tr('prevM')}">‹</button><h2>${m.toLocaleDateString(loc(),{month:'long',year:'numeric'})}</h2><button class="btn" data-act="today">${tr('today')}</button><button class="btn" data-act="next" aria-label="${tr('nextM')}">›</button></div>
 <div class="cal">${cells}</div>
 <div class="legend">${FAMS.map(f=>`<span style="${fc(f.k)}">${ico(f.k)}${esc(f[S.lang])}</span>`).join('')}</div>
 <section class="agenda"><h2>${tr('month')}</h2>${inM.length?'<div class="rows">'+inM.map(reqRow).join('')+'</div>':`<div class="empty"><p>${tr('emMonth')}</p></div>`}</section>`;
}

function planForm(r,c){
 const base=r&&r.scheduledAt?r.scheduledAt:((r&&r.wishDate)||ymd(new Date(Date.now()+864e5)))+'T10:00';const nm=c?tx(c,'name'):'';
 open(`<form class="f"><h2>${esc(r?(r.status==='approved'?tr('replanT',{n:nm}):tr('approveT',{n:nm})):tr('planT',{n:nm}))}</h2>
  <p class="sub">${r&&r.reason?esc(tr('reasonBy',{r:r.reason,w:who(r.requestedBy)}))+(r.wishDate?' · '+esc(tr('wish',{d:fmtD(r.wishDate)})):''):tr('direct')}</p>
  <div class="two"><label>${tr('date')}<input type="date" name="d" required value="${base.slice(0,10)}"></label><label>${tr('time')}<input type="time" name="h" required value="${base.slice(11,16)}"></label></div>
  <label>${tr('durMin')}<input type="number" name="dur" min="5" step="5" required value="${(r&&r.durationMin)||parseDur(tx(c,'duration'))}"></label>
  <label>${tr('att')}<input name="att" type="text" inputmode="email" placeholder="first.last@bank.com, …" value="${esc(r&&r.attendees)}"></label>
  <label>${tr('noteL')}<textarea name="note" placeholder="${esc(tr('notePh'))}">${esc(r&&r.managerNote)}</textarea></label>
  <div class="dacts"><button type="button" class="btn" data-act="close">${tr('cancel')}</button><button class="btn pri">${tr('place')}</button></div></form>`,
 async()=>{const d=val('d'),h=val('h');if(!d||!h)return toast(tr('eDT'));
  const at=new Date().toISOString();const upd={status:'approved',scheduledAt:d+'T'+h,durationMin:Math.max(5,parseInt(val('dur'),10)||60),attendees:val('att'),managerNote:val('note'),decidedBy:uid||null,decidedAt:at};
  let ref=null;const ok=await w(async()=>{if(r)await db.doc('requests/'+r.id).update(upd);else ref=await db.collection('requests').add({...upd,pole:c.pole,product:reqProd(c),cardId:c.id,reason:'',requestedBy:uid||null,createdAt:at})});
  if(ok){S.month=new Date(+d.slice(0,4),+d.slice(5,7)-1,1);render();
   const nr={...(r||{}),...upd,id:r?r.id:ref&&ref.id,pole:c.pole,product:r?r.product:reqProd(c),cardId:c.id};
   open(`<div><h2>${tr('placed')}</h2><p class="sub">${esc(nm)} — ${fmtDT(nr.scheduledAt)}, ${nr.durationMin} min.</p>
    <p>${tr('teamsNow',{a:nr.attendees?tr('invAnd'):''})}</p>
    <div class="dacts"><button class="btn" data-act="close">${tr('later')}</button>${teamsBtn(nr,'pri')}</div></div>`,null)}});
}
function noteForm(r,status,title,btn){
 open(`<form class="f"><h2>${title}</h2><label>${tr('msgTeam')}<textarea name="note"></textarea></label>
  <div class="dacts"><button type="button" class="btn" data-act="close">${tr('back')}</button><button class="btn pri">${btn}</button></div></form>`,
 async()=>{const ok=await w(()=>db.doc('requests/'+r.id).update({status,managerNote:val('note'),decidedBy:uid||null,decidedAt:new Date().toISOString()}),tr('tSaved'));if(ok)close()});
}
function evDetail(r){
 const c=cardById(r.cardId);
 open(`<div><h2>${esc(c?tx(c,'name'):tr('delCard'))}</h2><p class="sub">${esc(scopeName(r.pole,r.product))} · ${fmtDT(r.scheduledAt)}${r.durationMin?' · '+r.durationMin+' min':''}</p>
  ${c?`<p>${esc(tx(c,'definition'))}</p><dl class="kv"><dt>${tr('who')}</dt><dd>${esc(tx(c,'participants'))||'—'}</dd></dl>`:''}
  ${r.reason?`<p><b>${tr('reasonL')}</b> ${esc(r.reason)} (${esc(who(r.requestedBy))})</p>`:''}${r.managerNote?`<p><b>${tr('noteB')}</b> ${esc(r.managerNote)}</p>`:''}
  <div class="dacts">${isMgr()?`<button class="btn ghost left" data-act="cancel" data-id="${esc(r.id)}">${tr('cancelM')}</button><button class="btn" data-act="approve" data-id="${esc(r.id)}">${tr('replan')}</button>`:''}${teamsBtn(r)}<button class="btn pri" data-act="close">${tr('close')}</button></div></div>`,null);
}
function poleForm(){
 open(`<form class="f"><h2>${tr('newPole')}</h2><label>${tr('name')}<input name="name" required placeholder="Data"></label>
  <fieldset><legend>${tr('methods')}</legend><p class="hint">${tr('methHintPole')}</p>${methChecks('m',[],false)}</fieldset>
  <div class="dacts"><button type="button" class="btn" data-act="close">${tr('cancel')}</button><button class="btn pri">${tr('create')}</button></div></form>`,
 async()=>{const name=val('name');if(!name)return;let ref;const ok=await w(async()=>{const at=new Date().toISOString();ref=await db.collection('poles').add({name,methods:checked('m'),createdAt:at,deckInit:at})},tr('tPole'));
  if(ok){S.pole=ref.id;S.prod='';store('pole',S.pole);store('prod','');close();render()}},true);
}
function prodForm(){
 open(`<form class="f"><h2>${tr('newProd')}</h2><label>${tr('name')}<input name="name" required placeholder="EDMS"></label>
  <label>${tr('inPole')}<select name="pole">${S.poles.map(p=>`<option value="${esc(p.id)}"${p.id===S.pole?' selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
  <fieldset><legend>${tr('methods')}</legend><p class="hint">${esc(tr('methHintProd',{m:((poleOf(S.pole)||{}).methods||[]).map(methName).join(', ')||tr('none')}))}</p>${methChecks('m',[],false)}</fieldset>
  <div class="dacts"><button type="button" class="btn" data-act="close">${tr('cancel')}</button><button class="btn pri">${tr('create')}</button></div></form>`,
 async()=>{const name=val('name'),pole=val('pole');if(!name||!pole)return;let ref;const ok=await w(async()=>{const at=new Date().toISOString();ref=await db.collection('products').add({name,pole,methods:checked('m'),createdAt:at,deckInit:at})},tr('tProd'));
  if(ok){S.pole=pole;S.prod=ref.id;store('pole',pole);store('prod',ref.id);close();render()}},true);
}
function settingsForm(){
 const isP=!!S.prod;const o=isP?prodOf(S.prod):poleOf(S.pole);if(!o)return;
 open(`<form class="f"><h2>${esc(tr('setT',{n:o.name}))}</h2><label>${tr('name')}<input name="name" required value="${esc(o.name)}"></label>
  <fieldset><legend>${tr('methods')}</legend><p class="hint">${esc(isP?tr('methHintProd',{m:((poleOf(S.pole)||{}).methods||[]).map(methName).join(', ')||tr('none')}):tr('methHintPole'))}</p>${methChecks('m',o.methods||[],false)}</fieldset>
  <fieldset><legend>${tr('dormSet')}</legend><div class="two"><label>${tr('dormFactor')}<input type="number" name="df" min="1" max="12" step="1" value="${+o.dormantFactor||3}"></label><label>${tr('dormDays')}<input type="number" name="dd" min="7" max="730" step="1" value="${+o.dormantDays||90}"></label></div></fieldset>
  <div class="dacts">${isMgr()?(isP?`<button type="button" class="btn ghost left" data-act="delprod" data-id="${esc(o.id)}">${tr('delProd')}</button>`:`<button type="button" class="btn ghost left" data-act="delpole" data-id="${esc(o.id)}">${tr('delPole')}</button>`):''}<button type="button" class="btn" data-act="close">${tr('cancel')}</button><button class="btn pri">${tr('save')}</button></div></form>`,
 async()=>{const name=val('name');if(!name)return;const ok=await w(()=>db.doc((isP?'products/':'poles/')+o.id).update({name,methods:checked('m'),dormantFactor:Math.max(1,parseInt(val('df'),10)||3),dormantDays:Math.max(7,parseInt(val('dd'),10)||90)}),tr('tSaved'));if(ok)close()});
}
const tplFor=(lvl,M)=>CAT.filter(x=>x.l===lvl&&(x.m.includes('any')||!M.length||x.m.some(m=>M.includes(m))));
const missingTpl=()=>{const lvl=S.prod?'product':'pole';const have=new Set(S.cards.filter(c=>c.pole===S.pole&&!c.product).map(c=>c.tpl).filter(Boolean));return CAT.filter(x=>x.l===lvl&&!have.has(x.k))};
function importForm(){
 const lvl=S.prod?'product':'pole';const list=missingTpl();
 open(`<form class="f"><h2>${tr('impT')}</h2><p class="sub">${esc(tr('impHint',{lvl:lvl==='pole'?tr('lvlP'):tr('lvlPr')}))}</p>
  <div class="dacts"><button type="button" class="btn" data-act="close">${tr('cancel')}</button><button class="btn pri">${tr('impGo',{n:list.length})}</button></div></form>`,
 async()=>{const at=new Date().toISOString();let n=0;
  close();for(const x of missingTpl()){const ok=await w(()=>db.collection('cards').add(tplDoc(x,S.pole,null,at)));if(!ok)break;n++}
  S.view='catalog';S.meth='';render();toast(tr('tImported',{n}))});
}
const tplDoc=(x,pole,product,at)=>{const F=['name','definition','frequency','duration','participants','triggers'];const mk=a=>Object.fromEntries(F.map((f,i)=>[f,a[i]]));
 return {pole,product,level:x.l==='product'?'team':'pole',origin:scopeKey(),family:x.f,methods:x.m,tpl:x.k,t:{en:mk(x.en),fr:mk(x.fr)},createdAt:at,updatedAt:at,updatedBy:uid||null}};

function addTplForm(x){
 const sn=scopeName(S.pole);
 open(`<form class="f"><h2>${esc(tr('mAddT',{n:x[S.lang][0],s:sn}))}</h2><p class="sub">${esc(tr('mAddTxt',{s:sn}))}</p><p>${esc(x[S.lang][1])}</p>
  <div class="dacts"><button type="button" class="btn" data-act="close">${tr('cancel')}</button><button class="btn pri">${tr('mAddGo')}</button></div></form>`,
 async()=>{let ref;const ok=await w(async()=>{ref=await db.collection('cards').add(tplDoc(x,S.pole,null,new Date().toISOString()))},tr('tAddedCat'));
  if(ok){close();S.only=ref.id;S.view='catalog';location.hash='cards';render()}});
}
// Option B : supprime le produit, ses cartes propres, ses demandes et son jeu, sans retour
async function deleteProduct(id){
 const cs=S.cards.filter(c=>c.product===id),rs=S.reqs.filter(r=>r.product===id),ds=S.deck.filter(d=>d.scope==='p-'+id);
 const ok=await w(async()=>{for(const r of rs)await db.doc('requests/'+r.id).delete();for(const d of ds)await db.doc('deck/'+d.id).delete();for(const c of cs)await db.doc('cards/'+c.id).delete();await db.doc('products/'+id).delete()},tr('tProdDel'));
 if(ok){close();S.prod='';store('prod','');render()}}
// Option A : supprime le pôle et tout ce qu'il contient (produits, cartes, demandes, jeux), sans retour
const poleContent=id=>{const ps=S.products.filter(x=>x.pole===id);const keys=new Set(['P-'+id,...ps.map(x=>'p-'+x.id)]);
 return {ps,cs:S.cards.filter(c=>c.pole===id),rs:S.reqs.filter(r=>r.pole===id),ds:S.deck.filter(d=>keys.has(d.scope))}};
async function deletePole(id){const {ps,cs,rs,ds}=poleContent(id);
 const ok=await w(async()=>{for(const r of rs)await db.doc('requests/'+r.id).delete();for(const d of ds)await db.doc('deck/'+d.id).delete();for(const c of cs)await db.doc('cards/'+c.id).delete();for(const x of ps)await db.doc('products/'+x.id).delete();await db.doc('poles/'+id).delete()},tr('tPoleDel'));
 if(ok){close();S.pole=null;S.prod='';store('pole','');store('prod','');render()}}
/* ---------- événements ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act],[data-role],[data-tab],[data-fam],[data-meth],[data-lang],[data-view],[data-mchip],[data-showall]');if(!b)return;
 if(b.dataset.showall!==undefined){S.only=null;drawGrid();return}
 if(b.dataset.mchip){const x=CAT.find(t=>t.k===b.dataset.mchip);if(!x)return;const r=resolveTpl(x);
  const show=(c,view)=>{S.only=c.id;S.view=view;S.q='';$('#q').value='';location.hash='cards';render();window.scrollTo(0,0)};
  if(r.st==='ok')show(r.c,inDeck(r.c)?'deck':'catalog');
  else if(r.st==='arch')show(r.c,'archive');
  else if(r.st==='oth'){S.prod=r.c.product;store('prod',S.prod);show(r.c,inDeck(r.c)?'deck':'catalog');toast(tr('tSwitched',{p:scopeName(S.pole,S.prod)}))}
  else if(r.st==='miss')addTplForm(x);
  return}
 if(b.dataset.view){S.only=null;S.view=b.dataset.view;if(S.view==='catalog')S.meth='rec';drawFilters();drawGrid();return}
 if(b.dataset.lang){S.lang=b.dataset.lang;store('lang',S.lang);render();return}
 if(b.dataset.role){S.role=b.dataset.role;store('role',S.role);render();return}
 if(b.dataset.tab){location.hash=b.dataset.tab;return}
 if(b.dataset.fam!==undefined&&!b.dataset.act){S.only=null;S.fam=b.dataset.fam;drawFilters();drawGrid();return}
 if(b.dataset.meth!==undefined&&!b.dataset.act){S.only=null;S.meth=b.dataset.meth;drawFilters();drawGrid();return}
 const id=b.dataset.id,a=b.dataset.act,r=S.reqs.find(x=>x.id===id),c=anyCard(id);
 if(a==='close')close();
 else if(a==='new')cardForm();
 else if(a==='edit'&&c)cardForm(c);
 else if(a==='ask'&&c)askForm(c);
 else if(a==='plan'&&c)planForm(null,c);
 else if(a==='approve'&&r)planForm(r,cardById(r.cardId));
 else if(a==='reject'&&r)noteForm(r,'rejected',tr('reject'),tr('reject'));
 else if(a==='cancel'&&r)noteForm(r,'cancelled',tr('cancelM'),tr('cancelM'));
 else if(a==='withdraw'&&r)w(()=>db.doc('requests/'+r.id).delete(),tr('tWithdrawn'));
 else if(a==='ev'&&r)evDetail(r);
 else if(a==='import')importForm();
 else if(a==='delprod'&&isMgr()){const pr=prodOf(id);if(!pr)return;if(b.dataset.confirm)deleteProduct(id);else{b.dataset.confirm='1';b.textContent=tr('delProdConf',{n:pr.name,c:S.cards.filter(x=>x.product===id).length,r:S.reqs.filter(x=>x.product===id).length})}}
 else if(a==='delpole'&&isMgr()){const po=poleOf(id);if(!po)return;if(b.dataset.confirm)deletePole(id);else{const k=poleContent(id);b.dataset.confirm='1';b.textContent=tr('delPoleConf',{n:po.name,p:k.ps.length,c:k.cs.length,r:k.rs.length})}}
 else if(a==='adddeck'&&c)w(async()=>{let x=c;if(c.virtual){const t=CAT.find(k=>k.k===c.tpl);const ref=await db.collection('cards').add(tplDoc(t,S.pole,null,new Date().toISOString()));x={id:ref.id}}await setDeck(x,true)},tr('tAdded'));
 else if(a==='aside'&&c)w(()=>setDeck(c,false,{aside:true}),tr('tAside'));
 else if(a==='rmdeck'&&c&&isMgr())w(()=>setDeck(c,false),tr('tRemoved'));
 else if(a==='keep'&&c){const d=deckDoc(c)||{};w(()=>setDeck(c,true,{at:d.at||new Date().toISOString(),by:d.by||uid||null,keptAt:new Date().toISOString(),keptBy:uid||null}),tr('tKept'))}
 else if(a==='archive'&&c&&isMgr())w(()=>db.doc('cards/'+c.id).update({archived:true,archivedBy:uid||null,archivedAt:new Date().toISOString()}),tr('tArchived')).then(ok=>ok&&close());
 else if(a==='restore'&&c&&isMgr())w(()=>db.doc('cards/'+c.id).update({archived:false}),tr('tRestored'));
 else if(a==='purge'&&c&&isMgr()){if(b.dataset.confirm){w(()=>db.doc('cards/'+c.id).delete(),tr('tDeleted'))}else{b.dataset.confirm='1';b.textContent=tr('confDelPerm')}}
 else if(a==='prev'||a==='next'){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+(a==='next'?1:-1),1);drawCal()}
 else if(a==='today'){const n=new Date();S.month=new Date(n.getFullYear(),n.getMonth(),1);drawCal()}
});
$('#newCard').addEventListener('click',()=>cardForm());
$('#addPole').addEventListener('click',poleForm);
$('#addProd').addEventListener('click',prodForm);
$('#settings').addEventListener('click',settingsForm);
$('#coBtn').addEventListener('click',()=>window.MTG&&MTG.switchCompany());
$('#pole').addEventListener('change',e=>{S.only=null;S.pole=e.target.value;S.prod='';store('pole',S.pole);store('prod','');render()});
$('#prod').addEventListener('change',e=>{S.only=null;S.prod=e.target.value;store('prod',S.prod);render()});
$('#q').addEventListener('input',e=>{S.only=null;S.q=e.target.value;drawGrid()});
dlg.addEventListener('submit',e=>{e.preventDefault();if(onSubmit)onSubmit()});
ov.addEventListener('click',e=>{if(e.target===ov)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)close()});
const ALIAS={cartes:'cards',demandes:'requests',calendrier:'calendar',methodes:'methods'};
function route(){const h=location.hash.slice(1);const k=ALIAS[h]||h;S.tab=['cards','requests','calendar','methods'].includes(k)?k:'cards';render()}
window.addEventListener('hashchange',route);

/* ---------- données ---------- */
async function names(){
 if(!user)return;const ids=[...new Set(S.reqs.flatMap(r=>[r.requestedBy,r.decidedBy]).concat(S.deck.flatMap(d=>[d.by,d.keptBy]),S.cards.map(c=>c.archivedBy)).filter(x=>x&&x!==uid&&!(x in S.names)))];
 if(!ids.length)return;try{const ps=await user.profiles(ids);ids.forEach(i=>S.names[i]=(ps&&ps[i]&&ps[i].name)||tr('member'));render()}catch(e){}
}
(async()=>{
 route();
 [db,user]=await Promise.all([window.claude?claude.use('db'):null,window.claude?claude.use('user'):null]);
 S.got.ready=true;
 if(user){try{uid=await user.id()}catch(e){}try{const cw=await user.can('data.write');if(cw===false)canWrite=false}catch(e){}}
 if(!db){render();return}
 const timer=setTimeout(()=>{if(!S.got.cards){S.err=tr('wSlow');render()}},10000);
 const sub=(col,key)=>db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache){S.got[key]=true;if(key==='cards'){S.err='';clearTimeout(timer)}}render();if(key!=='poles'&&key!=='products')names()},e=>{clearTimeout(timer);S.err=tr('wRead',{c:e.code});render()});
 sub('poles','poles');sub('products','products');sub('cards','cards');sub('requests','reqs');sub('deck','deck');
 render();
})();
}
</script>
